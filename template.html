<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;900&family=Instrument+Serif:ital@1&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8F7F3; width: 1080px; height: 1080px; display: flex; align-items: center; justify-content: center; }
  .card { width: 1080px; height: 1080px; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .badge { background: #5E6AD2; color: #fff; padding: 6px 16px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 14px; }
  .date-label { color: #6B6B6B; font-style: italic; font-family: 'Instrument Serif', serif; font-size: 18px; }
  .title { font-size: 68px; font-weight: 900; color: #111; line-height: 1.1; margin-top: 20px;}
  .title span { color: #5E6AD2; font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; }
  .subtitle { font-size: 19px; color: #555; margin-top: 12px; max-width: 850px; }
  .content-area { margin-top: 40px; display: flex; flex-direction: column; gap: 24px; }
  .bar-row { display: flex; flex-direction: column; gap: 8px; }
  .bar-info { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; }
  .bar-track { width: 100%; height: 24px; background: #E8E7E3; border-radius: 6px; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .takeaway { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 20px; }
  .takeaway span { font-family: 'Instrument Serif', serif; color: #5E6AD2; font-size: 28px; font-style: italic; }
  .footer { display: flex; justify-content: space-between; border-top: 1px solid #E8E7E3; padding-top: 24px; font-size: 14px; }
  .brand { font-weight: 800; color: #5E6AD2; }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="badge">{{BADGE}}</div>
    <div class="date-label">AI & Tech Insights</div>
  </div>
  <div>
    <div class="title">{{TITLE_MAIN}} <span>{{TITLE_SPAN}}</span></div>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>
  <div class="content-area">{{BAR_ROWS}}</div>
  <div class="takeaway">Takeaway: <span>{{TAKEAWAY_NUM}}</span> {{TAKEAWAY_TEXT}}</div>
  <div class="footer">
    <div style="color: #9B8E7E; font-family: monospace;">Source: AI Industry Feeds</div>
    <div class="brand">@azaz-asif</div>
  </div>
</div>
</body>
</html>
