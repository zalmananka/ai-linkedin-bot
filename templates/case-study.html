<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;900&family=Instrument+Serif:ital@1&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F8F7F3;
            width: 1080px;
            height: 1080px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            color: #111;
        }

        .badge {
            background: #E8A33D;
            color: #111;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            align-self: flex-start;
        }

        .title {
            font-size: 60px;
            font-weight: 900;
            line-height: 1.1;
            margin-top: 25px;
        }

        .compare-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
            flex-grow: 1;
        }

        .card {
            padding: 30px;
            border-radius: 12px;
        }

        .card-old {
            background: #E8E7E3;
            border-left: 8px solid #9B8E7E;
        }

        .card-new {
            background: #111;
            color: #fff;
            border-left: 8px solid #E8A33D;
        }

        .c-label {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-old .c-label {
            color: #555;
        }

        .card-new .c-label {
            color: #E8A33D;
        }

        .c-text {
            font-size: 28px;
            font-weight: 700;
        }

        .result-box {
            text-align: center;
            margin-top: 30px;
        }

        .result-label {
            font-size: 18px;
            font-weight: 800;
            color: #E8A33D;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .result-text {
            font-size: 45px;
            font-weight: 900;
            margin-top: 10px;
        }

        .result-text span {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            color: #E8A33D;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <div class="badge">{{BADGE}}</div>
    <div class="title">{{TITLE}}</div>

    <div class="compare-box">
        <div class="card card-old">
            <div class="c-label">The Problem / Old Approach</div>
            <div class="c-text">{{PROBLEM}}</div>
        </div>
        <div class="card card-new">
            <div class="c-label">The Change / Solution</div>
            <div class="c-text">{{THE_CHANGE}}</div>
        </div>
    </div>

    <div class="result-box">
        <div class="result-label">THE RESULT</div>
        <div class="result-text">{{RESULT}}</div>
    </div>
</body>

</html>
