<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 1080px;
            height: 1080px
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0c10;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card {
            position: relative;
            width: 1080px;
            /* Fills entire width */
            height: 1080px;
            /* Fills entire height */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Removed border-radius so it stretches edge-to-edge */
            background:
                radial-gradient(circle at 92% 4%, rgba(101, 112, 255, .16), transparent 24%),
                linear-gradient(180deg, #18191e 0%, #0b0c10 100%);
        }

        /* subtle editorial frame shifted closer to the edges */
        .card:before {
            content: "";
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 24px;
            pointer-events: none;
            z-index: 20;
        }

        .card:after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            right: -170px;
            top: -170px;
            border-radius: 50%;
            background: rgba(105, 116, 255, .14);
            filter: blur(50px);
            pointer-events: none;
        }

        .topline {
            position: absolute;
            left: 50px;
            right: 50px;
            top: 40px;
            height: 3px;
            background: linear-gradient(90deg, #6475ff 0%, #8d97ff 35%, rgba(141, 151, 255, 0) 100%);
            border-radius: 99px;
            z-index: 3;
        }

        .header {
            padding: 75px 50px 40px;
            /* Adjusted padding for the expanded card */
            position: relative;
            z-index: 2;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 15px;
            border: 1px solid rgba(142, 153, 255, .45);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(101, 115, 255, .95), rgba(127, 139, 245, .92));
            box-shadow: 0 8px 25px rgba(89, 104, 230, .28), inset 0 1px 0 rgba(255, 255, 255, .25);
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .badge:before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, .9)
        }

        .brand {
            color: rgba(255, 255, 255, .48);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .headline {
            max-width: 940px;
            font-size: 58px;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -1.5px;
            text-wrap: balance;
            text-shadow: 0 2px 18px rgba(0, 0, 0, .18);
        }

        .image-container {
            width: 100%;
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: #101116;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: top center;
            filter: saturate(.96) contrast(1.03);
        }

        .image-container:before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(180deg, rgba(24, 25, 30, 1) 0%, rgba(24, 25, 30, 0) 8%);
        }

        .image-container:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 120px;
            z-index: 2;
            background: linear-gradient(to bottom, rgba(11, 12, 16, 0) 0%, #0b0c10 100%);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="topline"></div>

        <div class="header">
            <div class="header-row">
                <div class="badge">{{BADGE}}</div>
                <div class="brand">AI INTELLIGENCE • NEWS</div>
            </div>
            <div class="headline">{{HEADLINE}}</div>
        </div>

        <div class="image-container">
            <img src="{{REAL_IMAGE_URL}}" alt="News Image">
        </div>
    </div>
</body>

</html>
